# Core
set -g mouse on
set -g escape-time 0
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
set -g mode-keys vi
set -g set-clipboard on
set -g extended-keys on
set -g detach-on-destroy off
set -g display-time 1500
setw -g aggressive-resize on

# Colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Status bar: hidden unless the session has 2+ windows
set -g status off
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=colour237,fg=colour250"
set -g status-left ""
set -g status-right ""
setw -g window-status-separator " "
setw -g window-status-format "#I:#W"
setw -g window-status-current-format "#[bold]#I:#W#[nobold]"
set -gu status-format
set -g status-format[0] '#[align=left list=on]#{W:#I:#W ,#[bold]#I:#W#[nobold] }'

set-hook -g session-created  'if-shell -F "#{>=:#{session_windows},2}" "set-option status on" "set-option status off"'
set-hook -g after-new-window 'if-shell -F "#{>=:#{session_windows},2}" "set-option status on" "set-option status off"'
set-hook -g window-linked    'if-shell -F "#{>=:#{session_windows},2}" "set-option status on" "set-option status off"'
set-hook -g window-unlinked  'if-shell -F "#{>=:#{session_windows},2}" "set-option status on" "set-option status off"'

# Pane borders
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour246"

# Splits and new windows keep the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind |   split-window -h -c "#{pane_current_path}"
bind -   split-window -v -c "#{pane_current_path}"
bind c   new-window -c "#{pane_current_path}"

# Vim-style pane navigation and resizing
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy mode (vi style, yank to clipboard)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Reload
bind r source-file ~/.tmux.conf \; display "reloaded"
