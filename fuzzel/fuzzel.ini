[main]
layer=overlay
keyboard-focus=exclusive
exit-on-keyboard-focus-loss=yes
font=MonoLisa:size=9
terminal=ghostty
show-actions=no
fields=name,generic
horizontal-pad=8
vertical-pad=4
lines=16
width=35
match-mode=fzf
icons-enabled=no
prompt=> 
password-character=*
dpi-aware=no
[colors]
background=000000f2
text=f5f5f7ff
match=60a5faff
selection=2b2b2eff
selection-text=f5f5f7ff
selection-match=60a5faff
border=2a2a2cff

[border]
width=1
radius=4
selection-radius=4

[key-bindings]
cancel=Escape Control+c Mod1+q

