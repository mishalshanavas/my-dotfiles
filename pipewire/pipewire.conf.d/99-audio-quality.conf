# Desktop audio settings for a low-power laptop.
# 48 kHz is the native rate for most browser, video, and Bluetooth audio.

context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 ]

    # ~10.7 ms at 48 kHz: responsive for desktop audio with more CPU headroom.
    default.clock.quantum       = 512
    default.clock.min-quantum   = 64
    default.clock.max-quantum   = 2048
    default.clock.quantum-limit = 2048

    resample.quality            = 6
}
